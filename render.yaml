# This file was included as a way of keeping the backend/frontend code separate, since that
# is how the project was initially structured. I used Google's AI mode to help me build a
# pipeline, and it suggested using a Render blueprint, and gave me the following draft for
# the render.yaml file. If this contravenes the rules of this exercise, I am happy to repeat
# it (and the next exercise) using the structure we covered in the course. Please let me 
# know if so


services:
  # 1. The Express Backend Web Service
  - type: web
    name: mern-backend
    runtime: node
    rootDir: backend        # Anchors this service to the backend folder
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false        # You will paste your secret MongoDB URI in the Render UI

  # 2. The React Frontend Static Site
  - type: web
    name: mern-frontend
    runtime: static 
    rootDir: frontend       # Anchors this service to the frontend folder
    buildCommand: npm install && npm run build
    staticPublishPath: dist # Set to 'build' if using Create-React-App
    envVars:
      - key: VITE_API_URL
        value: https://mern-backend.onrender.com # Point this to your backend Render URL
